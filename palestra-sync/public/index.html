   (x < 100) e specchiata sul lato destro. Il colore dipende dalle serie della settimana. */
const BODY = (() => {
  // curva liscia chiusa che passa per i punti (Catmull-Rom -> Bezier)
  const sp = pts => {
    const n = pts.length; const f = v => Math.round(v * 10) / 10;
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${p2[0]} ${p2[1]}`;
    }

  const BACK = [

<script>
'use strict';
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const wkStart = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const today = () => ymd(new Date());
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const GIORNI = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const fmtDate = s => { const d = parse(s); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MESI[d.getMonth()]}`; };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmtN = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const isIt = () => S.cfg.lang === 'it';
const dn = e => e.name;
const catLabel = c => CAT_IT[c] || c;
const applyLang = () => Object.assign(MUSCLES, MUSCLES_IT);
const fmtSec = n => `${Math.floor(n / 60)}:${pad(n % 60)}`;
const matchQ = (e, q) => (e.name + ' ' + (e.it || '')).toLowerCase().includes(q);
function setCells(x, pre = '', tro = '') {
  if (x.sec != null) return `<span>${pre}${fmtSec(x.sec)}${tro}</span><span>${x.w > 0 ? fmtN(x.w) + ' kg' : ''}</span>`;
  if (x.min != null) return `<span>${pre}${fmtDur(Math.round(x.min * 60))}${tro}</span><span>${x.km > 0 ? (x.du === 'm' && x.d0 != null ? fmtN(x.d0) + ' m' : fmtN(x.km) + ' km') : ''}</span>`;
  return `<span>${pre}${fmtN(x.w)} kg${x.wu ? ' · avv.' : ''}${tro}${prTag(x)}</span><span>${x.r} rep</span>`;
}
const metric = x => x.sec != null ? x.sec : x.min != null ? (x.km > 0 ? x.km : x.min) : e1rm(x.w, x.r);

/* ---------- storage (IndexedDB chiave/valore) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const q = indexedDB.open('palestra-locale', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('kv');
      q.onsuccess = () => { this.db = q.result; res(); };
      q.onerror = () => rej(q.error);
    });
  },
  store(m) { return this.db.transaction('kv', m).objectStore('kv'); },
  get(k) { return new Promise(r => { const q = this.store('readonly').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); }); },
  set(k, v) { return new Promise(r => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => r(); t.onerror = () => r(); }); },
  del(k) { return new Promise(r => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => r(); }); },
  all() {
    return new Promise(r => {
      const out = {}; const q = this.store('readonly').openCursor();
      q.onsuccess = () => { const c = q.result; if (c) { out[c.key] = c.value; c.continue(); } else r(out); };
      q.onerror = () => r(out);
    });
  },
  clear() { return new Promise(r => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = () => r(); }); }
};

const S = { sets: [], custom: [], over: {}, cfg: { low: 10, high: 20, lastBackup: 0, backupDays: 7, lang: 'en' } };
let persist = key => DB.set(key, S[key]);
const UI = { period: 1, view: 'day', date: today(), exId: null, tab: 'reg', wk: wkStart(today()), filter: '', group: 'Tutti', editId: null, graph: 'e1rm', photos: {}, form: null };

/* ---------- esercizi ---------- */
const allEx = () => BUILTIN.map(e => ({ ...e, ...(S.over[e.id] || {}), builtin: true })).concat(S.custom);
const getEx = id => allEx().find(e => e.id === id);
const exName = id => { const e = getEx(id); return e ? dn(e) : '(esercizio eliminato)'; };
const mLabel = ids => (ids || []).map(m => MUSCLES[m]).join(', ') || '—';
const groupOf = e => {
  if (e.cat) return e.cat;
  const map = { pet: 'Chest', dor: 'Back', trp: 'Back', lom: 'Back', dan: 'Shoulders', dla: 'Shoulders', dpo: 'Shoulders', bic: 'Biceps', tri: 'Triceps', avb: 'Forearm', add: 'Abs', obl: 'Abs' };
  return map[(e.p || [])[0]] || 'Legs';
};
const subLabel = e => (e.p || []).length ? mLabel(e.p) : catLabel(groupOf(e));

/* ---------- statistiche ---------- */
function weekStats(wk, n = 1) {
  const start = addDays(wk, -7 * (n - 1)), end = addDays(wk, 6);
  const st = {};
  for (const m in MUSCLES) st[m] = { sets: 0, pdays: new Set(), sdays: new Set(), last: null, n };
  for (const x of S.sets) {
    const ex = getEx(x.ex); if (!ex) continue;
    if (!x.wu && x.date >= start && x.date <= end) {
      (ex.p || []).forEach(m => { st[m].sets += eqf(x, ex); st[m].pdays.add(x.date); });
      (ex.s || []).forEach(m => { if (!(ex.p || []).includes(m)) { st[m].sets += 0.5 * eqf(x, ex); st[m].sdays.add(x.date); } });
    }
  }
  for (const m in st) st[m].sets /= n;
  return st;
}
function lastTrained() {
  const last = {};
  for (const x of S.sets) {
    const ex = getEx(x.ex); if (!ex) continue;
    (ex.p || []).concat(ex.s || []).forEach(m => { if (!last[m] || x.date > last[m]) last[m] = x.date; });
  }
  return last;
}
function status(sets) {
  const { low, high } = S.cfg;
  if (sets <= 0) return { k: 'zero', t: 'Non allenato', c: '#444b59' };
  if (sets < low / 2) return { k: 'low', t: 'Carente', c: '#e5484d' };
  if (sets < low) return { k: 'mid', t: 'Poco', c: '#f0a43a' };
  if (sets <= high) return { k: 'ok', t: 'Ok', c: '#3fb76f' };
  return { k: 'high', t: 'Alto', c: '#4c8dff' };
}
function daysAgo(s) { return Math.round((parse(today()) - parse(s)) / 86400000); }

/* ---------- corpo SVG (vedi body.js) ---------- */
function bodySVG(side, st) { return BODY.svg(side, m => status(st[m].sets).c, side === 'f' ? 'Corpo visto davanti' : 'Corpo visto da dietro'); }

/* ---------- timer di recupero ---------- */
const TM = { end: 0, total: 0, iv: null };
function startTimer(sec) {
  if (!sec) return;
  TM.end = Date.now() + sec * 1000; TM.total = sec;
  clearInterval(TM.iv); TM.iv = setInterval(tickTimer, 250); tickTimer();
}
function tickTimer() {
  const el = $('#timer'); if (!el) return;
  const left = Math.ceil((TM.end - Date.now()) / 1000);
  if (left <= 0) {
    clearInterval(TM.iv); TM.end = 0; el.classList.add('hidden'); document.body.classList.remove('timer-on');
    try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (_) { }
    return;
  }
  el.classList.remove('hidden'); document.body.classList.add('timer-on');
  el.querySelector('span').textContent = `Recupero ${Math.floor(left / 60)}:${pad(left % 60)}`;
  el.querySelector('i').style.width = (100 * left / TM.total) + '%';
}

/* ---------- viste ---------- */
const PERIODS = [[1, '1 sett.'], [4, '4 sett.'], [12, '12 sett.'], [52, 'Anno']];
const periodBar = () => `<div class="chips scroll">${PERIODS.map(([n, t]) => `<button class="chip ${UI.period === n ? 'p' : ''}" data-a="per" data-v="${n}">${t}</button>`).join('')}</div>`;
function weekNav() {
  const n = UI.period, start = addDays(UI.wk, -7 * (n - 1)), end = addDays(UI.wk, 6);
  const cur = UI.wk === wkStart(today());
  const title = n === 1 ? (cur ? 'Questa settimana' : 'Settimana') : n === 52 ? (cur ? 'Ultimo anno' : 'Anno') : (cur ? `Ultime ${n} settimane` : `${n} settimane`);
  const range = n === 1 ? `${fmtShort(start)} – ${fmtShort(end)}` : `${fmtShort(start)} ${start.slice(0, 4)} – ${fmtShort(end)} ${end.slice(0, 4)}`;
  return `<div class="nav"><button data-a="wk" data-d="-7">‹</button><div>${title}<small>${range}</small></div><button data-a="wk" data-d="7">›</button></div>${periodBar()}`;
}

function viewDay() {
  const d = UI.date;
  const sets = S.sets.filter(x => x.date === d);
  const order = []; sets.forEach(x => { if (!order.includes(x.ex)) order.push(x.ex); });
  const prim = new Set(), sec = new Set();
  order.forEach(id => { const e = getEx(id); if (!e) return; (e.p || []).forEach(m => prim.add(m)); (e.s || []).forEach(m => { if (!(e.p || []).includes(m)) sec.add(m); }); });
  const label = d === today() ? 'Oggi' : (d === addDays(today(), -1) ? 'Ieri' : fmtDate(d));
  let h = `<div class="nav"><button data-a="day" data-d="-1">‹</button><div>${label}<small>${fmtShort(d)} ${d.slice(0, 4)}</small></div><button data-a="day" data-d="1">›</button></div><div class="datebar"><input type="date" id="dpick" value="${d}">${d !== today() ? '<button class="chip" data-a="today">Oggi</button>' : ''}</div>`;
  if (backupDue()) h += `<div class="banner" data-a="goto" data-v="more">⚠️ Backup non fatto da un po'. Tocca per farlo.</div>`;
  if (order.length) {
    h += `<div class="card"><b>Muscoli allenati</b><div class="chips">${[...prim].map(m => `<span class="chip p">${MUSCLES[m]}</span>`).join('')}${[...sec].filter(m => !prim.has(m)).map(m => `<span class="chip s">${MUSCLES[m]}</span>`).join('')}</div><small class="mut">Pieno = principale · Tenue = secondario · ${sets.length} serie totali</small></div>`;
  }
  order.forEach(id => {
    const ss = sets.filter(x => x.ex === id);
    const e = getEx(id);
    h += `<div class="card tap" data-a="open" data-id="${id}"><b>${esc(exName(id))}</b><small class="mut">${e ? subLabel(e) : ''}</small>
      ${ss.map(x => `<div class="setrow">${setCells(x)}</div>`).join('')}</div>`;
  });
  if (!order.length) h += `<div class="empty">Nessun esercizio registrato.<br>Tocca “+ Esercizio” per iniziare.</div>`;
  h += `<button class="fab" data-a="pick">+ Esercizio</button>`;
  return h;
}

function viewPick() {
  const q = UI.filter.toLowerCase();
  const groups = ['Tutti', ...CATS];
  const list = allEx().filter(e => (UI.group === 'Tutti' || groupOf(e) === UI.group) && matchQ(e, q))
    .sort((a, b) => dn(a).localeCompare(dn(b)));
  return `<div class="bar"><button data-a="back">‹</button><h2>Scegli esercizio</h2><button data-a="new">+ Nuovo</button></div>
  <input id="q" class="search" placeholder="Cerca…" value="${esc(UI.filter)}" autocomplete="off">
  <div class="chips scroll">${groups.map(g => `<button class="chip ${UI.group === g ? 'p' : ''}" data-a="grp" data-v="${g}">${g === 'Tutti' ? g : catLabel(g)}</button>`).join('')}</div>
  ${list.map(e => `<div class="item" data-a="open" data-id="${e.id}"><b>${esc(dn(e))}</b><small class="mut">${subLabel(e)}</small></div>`).join('') || '<div class="empty">Nessun risultato.</div>'}`;
}

function prevSession(id, before) {
  const ds = [...new Set(S.sets.filter(x => x.ex === id && x.date < before).map(x => x.date))].sort();
  const d = ds[ds.length - 1];

}

function exReg(ex) {
  const d = UI.date, ty = ex.type || 'wr';
  const todayS = S.sets.filter(x => x.ex === ex.id && x.date === d);
  const prev = prevSession(ex.id, d);
  const ref = (UI.editId && S.sets.find(x => x.id === UI.editId)) || todayS[todayS.length - 1] || (prev && prev.sets[prev.sets.length - 1]) || {};
  const inc = ex.inc || 2.5;
  const stp = (id, label, val, dd, dec) => `<label class="lbl">${label}</label><div class="step"><button data-a="st" data-f="${id}" data-d="-${dd}" data-dec="${dec}">−</button><input id="${id}" inputmode="decimal" value="${val}"><button data-a="st" data-f="${id}" data-d="${dd}" data-dec="${dec}">+</button></div>`;
  let h = `<div class="mut small">Data: ${fmtDate(d)}${UI.editId ? ' · ✎ modifica serie esistente' : ''}</div>`;
  if (ty === 'time') h += stp('sec', 'Tempo (secondi)', ref.sec || 30, 5, '') + stp('w', 'Peso aggiuntivo (kg, opzionale)', fmtN(ref.w || 0), inc, 1);
  else if (ty === 'cardio') h += stp('min', 'Durata (minuti)', fmtN(ref.min || 30), 5, 1) + stp('km', 'Distanza (km, opzionale)', fmtN(ref.km || 0), 0.5, 1);
  else h += stp('w', 'Peso (kg)', fmtN(ref.w || 0), inc, 1) + stp('r', 'Ripetizioni', ref.r || 10, 1, '');
  if (ty === 'wr') h += `<label class="lbl" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="wu" ${UI.wu ? 'checked' : ''} style="width:22px;height:22px"> Serie di avvicinamento (recupero breve)</label>`;
  h += `<div class="row2"><button class="btn ok" data-a="save">${UI.editId ? 'AGGIORNA' : 'SALVA'}</button><button class="btn" data-a="clear">PULISCI</button></div>`;
  if (ty !== 'cardio' || (ex.p || []).length) h += `<div class="card mini"><b>Primarii:</b> ${mLabel(ex.p)}<br><b>Secondari:</b> ${mLabel(ex.s)}<br><b>Recupero:</b> ${ex.rest ? ex.rest + ' s' : '—'}<br><b>Avvicinamento:</b> ${esc(ex.warm || '—')}</div>`;
  if (todayS.length) h += `<div class="card"><b>Serie di oggi</b>${todayS.map((x, i) => `<div class="setrow tap" data-a="editset" data-id="${x.id}">${setCells(x, (i + 1) + '. ')}<span class="x" data-a="delset" data-id="${x.id}">✕</span></div>`).join('')}</div>`;
  if (prev) h += `<div class="card"><b>Ultima volta (${fmtShort(prev.date)})</b>${prev.sets.map(x => `<div class="setrow">${setCells(x)}</div>`).join('')}</div>`;

}

function exHist(ex) {
  const all = S.sets.filter(x => x.ex === ex.id);
  const ds = [...new Set(all.map(x => x.date))].sort().reverse();
  if (!ds.length) return '<div class="empty">Nessuna serie registrata.</div>';
  const best = Math.max(...all.map(metric));
  return ds.map(d => `<div class="card"><b>${fmtDate(d)}</b>${all.filter(x => x.date === d).map(x => `<div class="setrow tap" data-a="editset" data-id="${x.id}">${setCells(x, '', metric(x) >= best - 0.01 ? ' 🏆' : '')}</div>`).join('')}</div>`).join('');
}

function graphOpts(ex) {
  const ty = ex.type || 'wr';
  if (ty === 'time') return [['sec', 'Tempo massimo']];
  if (ty === 'cardio') return [['min', 'Durata'], ['km', 'Distanza']];
  return [['e1rm', '1RM stimato'], ['maxw', 'Peso massimo'], ['maxr', 'Ripetizioni max'], ['vol', 'Volume sessione']];
}
const curGraph = ex => { const o = graphOpts(ex).map(x => x[0]); return o.includes(UI.graph) ? UI.graph : o[0]; };
function graphData(ex) {
  const g = curGraph(ex);
  const ds = [...new Set(S.sets.filter(x => x.ex === ex.id).map(x => x.date))].sort();
  return ds.map(d => {
    const ss = S.sets.filter(x => x.ex === ex.id && x.date === d);
    const wr = ss.filter(x => x.r != null);
    let v;
    if (g === 'e1rm') v = Math.max(...wr.map(x => e1rm(x.w, x.r)));
    else if (g === 'maxw') v = Math.max(...wr.map(x => x.w));
    else if (g === 'maxr') v = Math.max(...wr.map(x => x.r));
    else if (g === 'vol') v = wr.reduce((a, x) => a + x.w * x.r, 0);
    else if (g === 'sec') v = Math.max(...ss.filter(x => x.sec != null).map(x => x.sec));
    else if (g === 'min') v = ss.reduce((a, x) => a + (x.min || 0), 0);
    else v = ss.reduce((a, x) => a + (x.km || 0), 0);
    return { d, v };
  }).filter(p => isFinite(p.v));
}
function exGraph(ex) {
  const g = curGraph(ex);
  return `<select id="gsel">${graphOpts(ex).map(([k, t]) => `<option value="${k}" ${g === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
  <canvas id="cv" width="700" height="520"></canvas><div class="mut small center" id="gtip">Tocca un punto per i dettagli</div>`;
}
function drawGraph() {
  const cv = $('#cv'); if (!cv) return;
  const ex = getEx(UI.exId); const data = graphData(ex);
  const c = cv.getContext('2d'); const W = cv.width, H = cv.height;
  c.clearRect(0, 0, W, H);
  if (data.length < 1) { c.fillStyle = '#8a93a6'; c.font = '28px sans-serif'; c.fillText('Nessun dato', 40, 60); return; }
  const L = 70, R = 30, T = 30, B = 60;
  const vs = data.map(p => p.v); let mx = Math.max(...vs), mn = Math.min(...vs, 0);
  if (mx === mn) mx = mn + 1;
  mx *= 1.1;
  const t0 = parse(data[0].d).getTime(), t1 = parse(data[data.length - 1].d).getTime();
  const X = d => data.length === 1 ? (L + W - R) / 2 : L + (parse(d).getTime() - t0) / (t1 - t0 || 1) * (W - L - R);
  const Y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  c.strokeStyle = '#2b303b'; c.fillStyle = '#8a93a6'; c.font = '22px sans-serif'; c.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke(); c.fillText(Math.round(v), 10, y + 7); }
  c.fillText(fmtShort(data[0].d), L, H - 20); const lt = fmtShort(data[data.length - 1].d); c.fillText(lt, W - R - c.measureText(lt).width, H - 20);
  c.beginPath(); data.forEach((p, i) => { const x = X(p.d), y = Y(p.v); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.strokeStyle = '#4c8dff'; c.lineWidth = 4; c.stroke();
  cv._pts = data.map(p => ({ x: X(p.d), y: Y(p.v), p }));
  c.fillStyle = '#4c8dff'; cv._pts.forEach(q => { c.beginPath(); c.arc(q.x, q.y, 7, 0, 7); c.fill(); });
  cv.onclick = ev => {
    const r = cv.getBoundingClientRect(); const x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * H / r.height;
    let b = null, bd = 1e9; cv._pts.forEach(q => { const dd = Math.hypot(q.x - x, q.y - y); if (dd < bd) { bd = dd; b = q; } });
    if (b) $('#gtip').textContent = `${fmtDate(b.p.d)}: ${fmtN(b.p.v)}`;
  };
}

/* ---------- azioni ---------- */
function resize(file, max = 640) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.8)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

function blankForm() { return { isNew: true, id: 'c_' + uid(), name: '', it: '', cat: 'Chest', type: 'wr', p: [], s: [], rest: 90, inc: 2.5, warm: '', cues: ['', '', ''], err: '', notes: '', how: '' }; }
function readForm() {

  f.name = g('f_name').trim(); f.it = g('f_it').trim(); f.cat = g('f_cat') || f.cat; f.type = g('f_type') || f.type; f.rest = parseInt(g('f_rest')) || 0; f.inc = num(g('f_inc')) || 2.5; f.warm = g('f_warm').trim();
  f.cues = [g('f_c0'), g('f_c1'), g('f_c2')].map(s => s.trim()); f.err = g('f_err').trim(); f.how = g('f_how').trim(); f.notes = g('f_notes').trim();

/* ---------- CSV FitNotes ---------- */
const FN_HEAD = 'Date,Exercise,Category,Weight,Weight Unit,Reps,Distance,Distance Unit,Time,Comment';
const CATMUS = { Chest: 'pet', Back: 'dor', Shoulders: 'dla', Biceps: 'bic', Triceps: 'tri', Forearm: 'avb', Abs: 'add', Legs: 'qua', Cardio: '' };
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false; text = String(text).replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const parseDur = t => t ? t.split(':').reduce((a, x) => a * 60 + (parseFloat(x) || 0), 0) : 0;
const fmtDur = n => { const h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), sc = n % 60; return h ? `${h}:${pad(m)}:${pad(sc)}` : `${m}:${pad(sc)}`; };
const fmtDurFN = n => `${Math.floor(n / 3600)}:${pad(Math.floor(n % 3600 / 60))}:${pad(n % 60)}`;
const dec1 = n => { const t = String(Math.round(n * 1000) / 1000); return t.includes('.') ? t : t + '.0'; };
const toKm = (d, u) => u === 'm' ? d / 1000 : u === 'mi' ? d * 1.609344 : d;
const setKey = x => [x.date, x.ex, x.w ?? '', x.r ?? '', x.sec ?? '', x.min != null ? Math.round(x.min * 600) : '', x.d0 ?? x.km ?? ''].join('|');
async function importCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('il file è vuoto');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const ix = n => head.indexOf(n);
  if (ix('date') < 0 || ix('exercise') < 0) throw new Error('non trovo le colonne Date ed Exercise: non sembra un export FitNotes');
  const col = (r, n) => { const k = ix(n); return k < 0 ? '' : String(r[k] ?? '').trim(); };
  const byName = new Map(); allEx().forEach(e => { byName.set(e.name.toLowerCase(), e); if (e.it) byName.set(e.it.toLowerCase(), e); });
  const have = new Map(); S.sets.forEach(x => { const k = setKey(x); have.set(k, (have.get(k) || 0) + 1); });
  const seen = new Map(); let added = 0, skipped = 0, newEx = 0, bad = 0; const out = [];
  for (let n = 1; n < rows.length; n++) {
    const r = rows[n]; const date = col(r, 'date'), name = col(r, 'exercise');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !name) { bad++; continue; }
    const wv = col(r, 'weight'), wu = col(r, 'weight unit').toLowerCase(), reps = parseInt(col(r, 'reps')) || 0;
    const dist = col(r, 'distance'), du = (col(r, 'distance unit') || 'km').toLowerCase(), tm = col(r, 'time');
    if (!(reps > 0) && !tm && !dist) { bad++; continue; }
    let ex = byName.get(name.toLowerCase());
    if (!ex) {
      const cat = CATS.includes(col(r, 'category')) ? col(r, 'category') : 'Legs';
      const type = reps > 0 ? 'wr' : (cat === 'Cardio' || dist) ? 'cardio' : 'time';
      ex = { id: 'c_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), name, it: '', cat, type, p: CATMUS[cat] ? [CATMUS[cat]] : [], s: [], rest: type === 'wr' ? 90 : 0, inc: 2.5, warm: '', cues: ['', '', ''], err: '', notes: '' };
      S.custom.push(ex); byName.set(name.toLowerCase(), ex); newEx++;
    }
    const rec = { id: uid(), ex: ex.id, date, t: parse(date).getTime() + n };
    if (reps > 0) { const w = num(wv); rec.w = wu.startsWith('lb') ? Math.round(w * 0.45359237 * 100) / 100 : w; rec.r = reps; }
    else if ((ex.type || 'wr') === 'time' && !dist) { rec.sec = Math.round(parseDur(tm)); rec.w = num(wv); }
    else { rec.min = Math.round(parseDur(tm) / 60 * 10000) / 10000; if (dist) { rec.d0 = num(dist); rec.du = du; rec.km = Math.round(toKm(rec.d0, du) * 100000) / 100000; } else rec.km = 0; }
    const cm = col(r, 'comment'); if (cm) rec.c = cm;
    const k = setKey(rec); const c = (seen.get(k) || 0) + 1; seen.set(k, c);
    if (c <= (have.get(k) || 0)) { skipped++; continue; }
    out.push(rec); added++;
  }
  if (out.length) { S.sets.push(...out); await persist('sets'); }
  if (newEx) await persist('custom');
  return { added, skipped, newEx, bad };
}
function exportCSV() {
  const lines = [FN_HEAD];
  const sorted = S.sets.map((x, i) => [x, i]).sort((a, b) => a[0].date < b[0].date ? -1 : a[0].date > b[0].date ? 1 : a[1] - b[1]).map(a => a[0]);
  for (const x of sorted) {
    const e = getEx(x.ex); if (!e) continue;
    let w = '', wu = '', r = '', d = '', du = '', tm = '';
    if (x.sec != null) { tm = fmtDurFN(x.sec); if (x.w > 0) { w = dec1(x.w); wu = 'kgs'; } }
    else if (x.min != null) { tm = fmtDurFN(Math.round(x.min * 60)); if (x.km > 0 || x.d0 > 0) { d = dec1(x.d0 != null ? x.d0 : x.km); du = x.d0 != null ? (x.du || 'km') : 'km'; } }
    else { w = dec1(x.w); wu = 'kgs'; r = String(x.r); }
    const q = v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    lines.push([x.date, q(e.name), groupOf(e), w, wu, r, d, du, tm, '"' + (x.c || '').replace(/"/g, '""') + '"'].join(','));
  }
  return lines.join('\n');
}
async function runCSV(text) {

}

function hmOpts(ex) {
  const ty = ex.type || 'wr';
  if (ty === 'time') return [['def', 'Tempo e peso'], ['dur', 'Durata (secondi)']];
  if (ty === 'cardio') return [['def', 'Durata e distanza'], ['dur', 'Durata'], ['dist', 'Distanza']];
  return [['def', 'Peso × ripetizioni'], ['reps', 'Ripetizioni'], ['e1rm', '1RM stimato'], ['vol', 'Volume totale'], ['maxw', 'Peso massimo (totale)'], ['dur', 'Durata allenamento']];
}
const HLAB = { reps: 'rip.', e1rm: '1RM', vol: 'volume', maxw: 'max', dur: 'durata', dist: 'distanza' };
function dayAgg(ex, d, ss, m) {
  const ty = ex.type || 'wr', wr = ss.filter(x => x.r != null && !x.wu);
  if (m === 'reps') return { v: wr.reduce((a, x) => a + x.r, 0), t: n => n + ' rip.' };
  if (m === 'e1rm') return { v: Math.max(0, ...wr.map(x => e1rm(tot(x), x.r))), t: n => fmtN(n) + ' kg' };
  if (m === 'vol') return { v: wr.reduce((a, x) => a + tot(x) * x.r, 0), t: n => Math.round(n) + ' kg' };
  if (m === 'maxw') return { v: Math.max(0, ...wr.map(x => tot(x))), t: n => fmtN(n) + ' kg' };
  if (m === 'dur') {
    if (ty === 'time') return { v: Math.max(0, ...ss.map(x => x.sec || 0)), t: n => fmtSec(n) };
    if (ty === 'cardio') return { v: ss.reduce((a, x) => a + (x.min || 0), 0), t: n => fmtDur(Math.round(n * 60)) };
    const i = sessInfo(d); return { v: i && !i.run ? i.ms / 6e4 : 0, t: n => n ? Math.round(n) + ' min' : '—' };
  }
  if (m === 'dist') return { v: ss.reduce((a, x) => a + (x.km || 0), 0), t: n => fmtN(n) + ' km' };
  return null;
}
function setVal(x, m) {
  if (x.r == null) return null;
  if (m === 'reps') return x.r + ' rip.';
  if (m === 'e1rm') return fmtN(e1rm(tot(x), x.r)) + ' kg';
  if (m === 'vol') return Math.round(tot(x) * x.r) + ' kg';
  if (m === 'maxw') return fmtN(tot(x)) + ' kg';
  return null;
}

  if (ord === 'v') ds.sort((a, b) => (aggs[b] ? aggs[b].v : 0) - (aggs[a] ? aggs[a].v : 0) || (a < b ? 1 : -1)); else ds.sort(); if (ord === 'd') ds.reverse();
